# CI of the JAZLA customer app (apps/mobile): analyze, test, Android debug build,
# and a check that the generated API client matches services/api/openapi.json.
name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'services/api/openapi.json'
      - 'docs/design/tokens.json'
      - '.github/workflows/ci-mobile.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/mobile/**'
      - 'services/api/openapi.json'
      - 'docs/design/tokens.json'
      - '.github/workflows/ci-mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Generated API client is up to date
        run: |
          ./scripts/gen-api-client.sh
          # status, not diff: a new generated file is untracked and diff would miss it.
          test -z "$(git status --porcelain -- packages/jazla_api)" || { git status --porcelain -- packages/jazla_api; exit 1; }

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

      - name: Build Android debug (dev flavor)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
