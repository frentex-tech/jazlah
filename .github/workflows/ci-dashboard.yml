# CI of the dashboard (apps/dashboard): API types current, lint (incl. the RTL rule), typecheck, build, Playwright smoke.
name: Dashboard CI

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/config/**'
      - 'docs/design/tokens.json'
      - 'docs/design/spec/ds/design-system.json'
      - 'services/api/openapi.json'
      - '.github/workflows/ci-dashboard.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/config/**'
      - 'docs/design/tokens.json'
      - 'docs/design/spec/ds/design-system.json'
      - 'services/api/openapi.json'
      - '.github/workflows/ci-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install (lockfile frozen)
        run: pnpm install --frozen-lockfile

      - name: Deploy guard refuses the mock flags (scripts/deploy-guard.sh)
        run: |
          sh scripts/deploy-guard.sh
          # `if`, not `!`: bash's errexit ignores a negated command.
          if DASHBOARD_TEST_BUILD=1 sh scripts/deploy-guard.sh; then exit 1; fi
          if DASHBOARD_API_MOCK=0 sh scripts/deploy-guard.sh; then exit 1; fi

      - name: API types match services/api/openapi.json
        run: pnpm api:generate && git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit self-checks
        run: pnpm test:unit

      - name: Build (production) carries no mock code
        env:
          MEDIA_ORIGINS: http://localhost:9002
        run: |
          pnpm build
          ! grep -rlF --exclude='*.map' -e 'Fresh beef ribeye' -e 'mock-rt-' -e '__adminCatalog' -e '__operations' .next/server .next/static

      - name: Build (test build for the mock suite)
        env:
          # The mock suite's own build: mocks compiled in, uploads on the mock storage (no MEDIA_ORIGINS). Fixed at build
          # time; a deploy builds without it (README "Builds"), so no runtime variable can open the mocks there.
          DASHBOARD_TEST_BUILD: '1'
        run: |
          rm -rf .next && pnpm build
          # Positive control for the check above: the same markers are found in a test build.
          for m in 'Fresh beef ribeye' 'mock-rt-' '__adminCatalog' '__operations'; do grep -rqF --exclude='*.map' "$m" .next/server || { echo "::error::marker '$m' missing from the test build"; exit 1; }; done

      - name: Install Playwright Chromium
        # The Ubuntu mirrors fail now and then: retry before failing the job.
        run: for i in 1 2 3; do pnpm exec playwright install --with-deps chromium && exit 0; sleep 15; done; exit 1

      - name: Playwright smoke
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/test-results
          retention-days: 7

  # The acceptance checks that need the real API (e2e-api/): a seeded services/api with the review accounts, built
  # and run here exactly as its own CI does. Only reads services/api; never changes it.
  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: jazla
          POSTGRES_PASSWORD: jazla
          POSTGRES_DB: jazla
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jazla -d jazla"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --maxmemory-policy noeviction
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://jazla:jazla@localhost:5434/jazla
      REDIS_URL: redis://localhost:6380/0
      STORAGE_ENDPOINT: http://localhost:9002
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: jazla
      STORAGE_SECRET_ACCESS_KEY: jazla-local-storage
      STORAGE_PUBLIC_BUCKET: jazla-public
      STORAGE_PRIVATE_BUCKET: jazla-private
      STORAGE_PUBLIC_BASE_URL: http://localhost:9002/jazla-public
      SMS_PROVIDERS: log
      # The seed's admin and vendor (docs/frontend/auth.md), and a fresh applicant for the vendor application spec.
      AUTH_REVIEW_ACCOUNTS: '+966500000004:444444,+966500000002:222222,+966500000041:414141'
      # Each test signs in again: no 60 s resend wait and no 3-per-10-minutes phone limit for this run.
      AUTH_OTP_RESEND_WAIT_SECONDS: '1'
      AUTH_OTP_PHONE_LIMIT: '100'
      AUTH_OTP_PHONE_DAILY_LIMIT: '100'
      # Every browser call reaches the API from this one address (the dashboard server): no per-address limits here.
      AUTH_OTP_REQUEST_ADDRESS_LIMIT: '1000'
      AUTH_OTP_VERIFY_ADDRESS_LIMIT: '1000'
      RATE_LIMIT_MAX_REQUESTS: '100000'
      RATE_LIMIT_PRE_ROUTING_MAX_REQUESTS: '100000'
      API_URL: http://localhost:3000

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json

      - name: Set up Node for the API (services/api/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: services/api/.nvmrc

      - name: API, install, migrate, seed, build
        working-directory: services/api
        run: |
          pnpm install --frozen-lockfile
          docker compose up -d --wait minio
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
          pnpm build

      - name: API, start
        working-directory: services/api
        run: |
          nohup node dist/main > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/v1/health >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Set up Node for the dashboard (apps/dashboard/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Dashboard, install and build
        working-directory: apps/dashboard
        env:
          NODE_ENV: production
          # A real production build (no mocks): the CSP lets the browser upload to the job's MinIO.
          MEDIA_ORIGINS: http://localhost:9002
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        # The Ubuntu mirrors fail now and then: retry before failing the job.
        run: for i in 1 2 3; do pnpm exec playwright install --with-deps chromium && exit 0; sleep 15; done; exit 1

      - name: Acceptance against the API
        working-directory: apps/dashboard
        env:
          NODE_ENV: production
          PORT: '3002'
        run: pnpm test:e2e:api

      - name: API log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"
