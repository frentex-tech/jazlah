name: Progress dashboard
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  issues:
    types: [closed, reopened, assigned, unassigned, labeled, unlabeled]
  # Every merge lands as a push to develop. No pull_request trigger: the github-pages
  # environment only accepts develop, so a PR run's deploy job always failed.
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: write
  id-token: write
# No concurrency group: a cancelled run leaves a cancelled check on develop's head commit
# (issue events run on that commit too), and Render's "After CI Checks Pass" then skips the deploy.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: develop }
      - name: Build dashboard page and update pinned issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/backlog/progress.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Two runs can overlap; the loser's deploy is refused. The next run publishes again,
        # so don't turn a stale progress page into a red check that blocks staging.
        continue-on-error: true
