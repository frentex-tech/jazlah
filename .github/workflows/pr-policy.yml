name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Branch, target and title rules (see CONTRIBUTING.md)
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          work='^(feature|fix|chore|docs|refactor|test)/[0-9]+-[a-z0-9-]+$'
          case "$BASE" in
            main)
              [[ "$HEAD" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$HEAD" =~ ^hotfix/[0-9]+-[a-z0-9-]+$ ]] \
                || fail "main only accepts release/vX.Y.Z or hotfix/<issue>-<slug> (got '$HEAD')" ;;
            develop)
              [[ "$HEAD" =~ $work || "$HEAD" =~ ^release/ || "$HEAD" =~ ^hotfix/ || "$HEAD" == main ]] \
                || fail "branch '$HEAD' must be <type>/<issue>-<slug>, e.g. feature/42-otp-login" ;;
            release/*)
              [[ "$HEAD" =~ ^fix/[0-9]+-[a-z0-9-]+$ ]] || fail "release branches only accept fix/<issue>-<slug>" ;;
            *) fail "PRs must target develop, main or release/*" ;;
          esac
          [[ "$TITLE" =~ ^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert)(\((api|mobile|web|dashboard|infra|docs|deps)\))?!?:\ .+ ]] \
            || fail "PR title must follow Conventional Commits, e.g. 'feat(api): add OTP login'"
          if [[ "$HEAD" =~ $work ]]; then
            grep -Eqi '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs) #[0-9]+' <<<"$BODY" || fail "link the issue in the PR body (Closes #123)"
          fi
          echo "PR policy OK"
